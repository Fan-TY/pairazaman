# Configuración General de la Aplicación
spring.application.name=pairazaman
server.port=8080
server.servlet.context-path=/

# DataSource MySQL (rama Gestion_Clientes)
# Crea la base de datos antes de arrancar:
#   CREATE DATABASE pairazaman CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# Puedes sobreescribir las credenciales con DB_URL, DB_USERNAME (o DB_USER) y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pairazaman?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Motor de Plantillas Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Archivos Estáticos
spring.web.resources.static-locations=classpath:/static/

# Evita errores al serializar proxies de Hibernate (igual usamos DTOs).
spring.jackson.serialization.fail-on-empty-beans=false
