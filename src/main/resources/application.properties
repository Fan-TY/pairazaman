spring.application.name=pairazaman

# ---------------------------------------------------------------------------
# MySQL
# Crea la base de datos antes de arrancar:
#   CREATE DATABASE pairazaman CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# Puedes sobreescribir las credenciales con las variables DB_URL, DB_USER y DB_PASSWORD.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pairazaman?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Este módulo expone una API REST; no usa plantillas Thymeleaf por ahora.
spring.thymeleaf.check-template-location=false

# Evita errores al serializar proxies de Hibernate (igual usamos DTOs).
spring.jackson.serialization.fail-on-empty-beans=false
