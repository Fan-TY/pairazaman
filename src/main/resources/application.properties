# Configuración General de la Aplicación
spring.application.name=pairazaman
server.port=8080
server.servlet.context-path=/

# DataSource PostgreSQL (configurable por variables de entorno o valores por defecto)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pairazaman_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Motor de Plantillas Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Archivos Estáticos
spring.web.resources.static-locations=classpath:/static/

# Evita errores al serializar proxies de Hibernate (igual usamos DTOs).
spring.jackson.serialization.fail-on-empty-beans=false
