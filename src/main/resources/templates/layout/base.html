<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pairazamán - Sistema de Control y Seguridad</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/dashboard}">
                <i class="bi bi-shield-lock-fill text-primary fs-4"></i>
                <span>PAIRAZAMÁN <small class="fw-normal text-muted fs-6">Security MVC</small></span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/incidencias}">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i> Incidencias
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/camaras}">
                            <i class="bi bi-camera-video-fill me-1"></i> Cámaras
                        </a>
                    </li>
                </ul>

                <!-- Acciones de Usuario / Sesión -->
                <div class="d-flex align-items-center gap-3">
                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2 text-white">
                        <span class="badge bg-primary px-3 py-2 rounded-pill">
                            <i class="bi bi-person-circle me-1"></i>
                            <span sec:authentication="name">Usuario</span>
                        </span>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-box-arrow-right me-1"></i> Salir
                            </button>
                        </form>
                    </div>
                    <div sec:authorize="!isAuthenticated()">
                        <a th:href="@{/login}" class="btn btn-primary btn-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="flex-grow-1 py-4">
        <div class="container-fluid px-4">
            <!-- Alertas Flash -->
            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${mensajeExito}">Operación exitosa.</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-octagon-fill me-2"></i>
                <span th:text="${mensajeError}">Ocurrió un error.</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Inserción del contenido hijo -->
            <th:block th:replace="${content}"></th:block>
        </div>
    </main>

    <!-- Pie de Página Institucional -->
    <footer class="bg-dark text-white-50 py-3 mt-auto border-top border-secondary">
        <div class="container-fluid px-4 d-flex flex-wrap justify-content-between align-items-center">
            <p class="col-md-6 mb-0">
                &copy; 2026 <strong>Pairazamán</strong> &bull; Arquitectura MVC con Spring Boot &amp; Thymeleaf
            </p>
            <ul class="nav col-md-6 justify-content-end">
                <li class="nav-item"><a th:href="@{/dashboard}" class="nav-link px-2 text-white-50">Inicio</a></li>
                <li class="nav-item"><a th:href="@{/incidencias}" class="nav-link px-2 text-white-50">Incidencias</a></li>
                <li class="nav-item"><a th:href="@{/camaras}" class="nav-link px-2 text-white-50">Cámaras</a></li>
            </ul>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
