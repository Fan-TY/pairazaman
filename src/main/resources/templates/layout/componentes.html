<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

  <div th:fragment="encabezado(titulo, descripcion, icono, clase)" th:class="'inicio-banner ' + ${clase}">
    <div class="d-flex align-items-center gap-3">
      <i th:class="'bi ' + ${icono} + ' display-5'"></i>
      <div>
        <p class="mb-0 small opacity-75">Bienvenido, <strong th:text="${nombreUsuario}">Usuario</strong></p>
        <h2 class="fw-bold mb-1" th:text="${titulo}">Título</h2>
        <p class="mb-0 opacity-75" th:text="${descripcion}">Descripción</p>
      </div>
    </div>
  </div>

  <a th:fragment="acceso(icono, titulo, descripcion, url, color)" th:href="@{${url}}" class="text-decoration-none">
    <div class="card acceso-rapido border-0 shadow-sm h-100">
      <div class="card-body d-flex align-items-start gap-3">
        <div th:class="'bg-' + ${color} + '-subtle text-' + ${color} + ' rounded-3 p-3'">
          <i th:class="'bi ' + ${icono} + ' fs-3'"></i>
        </div>
        <div>
          <h6 class="fw-bold text-dark mb-1" th:text="${titulo}">Título</h6>
          <p class="text-muted small mb-0" th:text="${descripcion}">Descripción</p>
        </div>
      </div>
    </div>
  </a>

</body>
</html>
