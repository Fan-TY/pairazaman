<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
  <head>
    <title>Usuarios</title>
  </head>
  <body>
    <th:block th:fragment="content">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h2 class="fw-bold mb-1">Usuarios del sistema</h2>
          <p class="text-muted mb-0">Cuentas del personal que ingresa al sistema y su rol.</p>
        </div>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-pz px-4">
          <i class="bi bi-person-plus-fill me-1"></i> Nuevo usuario
        </a>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
              <th scope="col" class="ps-4">Nombre</th>
              <th scope="col">Usuario</th>
              <th scope="col">Rol</th>
              <th scope="col">Técnico</th>
              <th scope="col">Estado</th>
              <th scope="col" class="text-end pe-4">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(usuarios)}">
              <td colspan="6" class="text-center py-4 text-muted">No hay usuarios registrados.</td>
            </tr>
            <tr th:each="u : ${usuarios}">
              <td class="ps-4">
                <strong th:text="${u.nombreCompleto}">Nombre</strong>
                <small class="text-muted d-block" th:text="${u.email}">correo</small>
              </td>
              <td th:text="${u.username}">usuario</td>
              <td><span class="badge bg-primary" th:text="${u.rol.nombreVisible}">Rol</span></td>
              <td th:text="${u.tecnico != null ? (u.tecnico.telefono != null and !u.tecnico.telefono.isEmpty() ? u.tecnico.telefono : 'Vinculado') : '—'}">—</td>
              <td>
                <span th:if="${u.activo}" class="badge bg-success">Activo</span>
                <span th:unless="${u.activo}" class="badge bg-secondary">Inactivo</span>
              </td>
              <td class="text-end pe-4">
                <div class="d-inline-flex gap-1">
                  <a th:href="@{'/usuarios/editar/' + ${u.id}}" class="btn btn-sm btn-outline-primary" title="Editar">
                    <i class="bi bi-pencil-square"></i>
                  </a>
                  <button type="button" class="btn btn-sm btn-outline-secondary" title="Restablecer contraseña"
                          data-bs-toggle="modal" th:attr="data-bs-target='#pass' + ${u.id}">
                    <i class="bi bi-key-fill"></i>
                  </button>
                  <form th:action="@{'/usuarios/' + ${u.id} + '/estado'}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm"
                            th:classappend="${u.activo} ? 'btn-outline-danger' : 'btn-outline-success'"
                            th:title="${u.activo} ? 'Desactivar' : 'Activar'"
                            th:disabled="${u.username == #authentication.name}">
                      <i class="bi" th:classappend="${u.activo} ? 'bi-person-slash' : 'bi-person-check-fill'"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div th:each="u : ${usuarios}" class="modal fade" th:id="'pass' + ${u.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <form th:action="@{'/usuarios/' + ${u.id} + '/password'}" method="post" class="modal-content border-0 shadow">
            <div class="modal-header">
              <h5 class="modal-title fw-bold">Restablecer contraseña</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <p class="text-muted small">Nueva contraseña para <strong th:text="${u.username}">usuario</strong>.</p>
              <input type="password" name="nuevaPassword" class="form-control" minlength="6" placeholder="Mínimo 6 caracteres" required>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-pz px-4">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </th:block>
  </body>
</html>
