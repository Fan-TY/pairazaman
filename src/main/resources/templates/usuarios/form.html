<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
  <head>
    <title>Usuario</title>
  </head>
  <body>
    <th:block th:fragment="content">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-7 col-xl-6">
          <div class="mb-4">
            <h2 class="fw-bold mb-1" th:text="${editando} ? 'Editar usuario' : 'Nuevo usuario'">Nuevo usuario</h2>
            <p class="text-muted mb-0">Datos de acceso y rol del personal.</p>
          </div>

          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <form th:action="@{/usuarios/guardar}" th:object="${usuarioForm}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                  <label for="nombreCompleto" class="form-label fw-semibold small">Nombre completo</label>
                  <input type="text" class="form-control" id="nombreCompleto" th:field="*{nombreCompleto}" maxlength="120" required>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-12 col-md-6">
                    <label for="username" class="form-label fw-semibold small">Usuario</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" maxlength="50" th:readonly="${editando}" required>
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="email" class="form-label fw-semibold small">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" maxlength="100" required>
                  </div>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-12 col-md-6">
                    <label for="rol" class="form-label fw-semibold small">Rol</label>
                    <select class="form-select" id="rol" th:field="*{rol}" required>
                      <option value="" disabled>Selecciona un rol</option>
                      <option th:each="r : ${roles}" th:value="${r}" th:text="${r.nombreVisible}">Rol</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-6 d-none" id="grupoTelefono">
                    <label for="telefono" class="form-label fw-semibold small">Teléfono del técnico</label>
                    <input type="text" class="form-control" id="telefono" th:field="*{telefono}" maxlength="20">
                  </div>
                </div>

                <div class="row g-3 mb-4" th:unless="${editando}">
                  <div class="col-12 col-md-6">
                    <label for="password" class="form-label fw-semibold small">Contraseña</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" minlength="6" required>
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="confirmarPassword" class="form-label fw-semibold small">Confirmar contraseña</label>
                    <input type="password" class="form-control" id="confirmarPassword" th:field="*{confirmarPassword}" minlength="6" required>
                  </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                  <a th:href="@{/usuarios}" class="btn btn-light px-4">Cancelar</a>
                  <button type="submit" class="btn btn-pz px-4">
                    <i class="bi bi-check2-circle me-1"></i> Guardar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
            var rol = document.getElementById('rol');
            var grupo = document.getElementById('grupoTelefono');
            function actualizar() {
                grupo.classList.toggle('d-none', rol.value !== 'ROLE_TECNICO');
            }
            rol.addEventListener('change', actualizar);
            actualizar();
        })();
      </script>
    </th:block>
  </body>
</html>
