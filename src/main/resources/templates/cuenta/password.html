<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
  <head>
    <title>Cambiar contraseña</title>
  </head>
  <body>
    <th:block th:fragment="content">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="mb-4">
            <h2 class="fw-bold mb-1">Cambiar contraseña</h2>
            <p class="text-muted mb-0">Actualiza la contraseña de tu cuenta.</p>
          </div>

          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <form th:action="@{/cuenta/password}" method="post">
                <div class="mb-3">
                  <label for="actual" class="form-label fw-semibold small">Contraseña actual</label>
                  <input type="password" class="form-control" id="actual" name="actual" required>
                </div>
                <div class="mb-3">
                  <label for="nueva" class="form-label fw-semibold small">Nueva contraseña</label>
                  <input type="password" class="form-control" id="nueva" name="nueva" minlength="6" required>
                </div>
                <div class="mb-4">
                  <label for="confirmar" class="form-label fw-semibold small">Confirmar nueva contraseña</label>
                  <input type="password" class="form-control" id="confirmar" name="confirmar" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-pz w-100 py-2">
                  <i class="bi bi-shield-lock-fill me-1"></i> Actualizar contraseña
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
