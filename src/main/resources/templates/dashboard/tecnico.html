<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<head>
  <title>Inicio - Técnico</title>
</head>
  <body>
    <th:block th:fragment="content">
      <div th:replace="~{layout/componentes :: encabezado('Panel del Personal Técnico', 'Instalaciones y reclamos en campo', 'bi-tools', 'inicio-tecnico')}"></div>

      <div th:if="${avisos != null and !#lists.isEmpty(avisos)}" class="alert alert-warning shadow-sm mb-3">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
          <strong><i class="bi bi-bell-fill me-1"></i> Avisos de órdenes (<span th:text="${#lists.size(avisos)}">1</span>)</strong>
          <form th:action="@{/avisos/leidos}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-dark">Marcar como leídos</button>
          </form>
        </div>
        <ul class="mb-0">
          <li th:each="a : ${avisos}">
            <small class="text-muted" th:text="${#temporals.format(a.fecha, 'dd/MM HH:mm')}">22/11 10:00</small>
            <span th:text="${a.mensaje}">Nueva orden asignada</span>
          </li>
        </ul>
      </div>

      <div class="row g-3">
        <div class="col-12 col-md-6">
          <th:block th:replace="~{layout/componentes :: acceso('bi-tools', 'Instalaciones', 'Consulta tus órdenes y actualiza su estado tras la visita.', '/instalaciones', 'warning')}"></th:block>
        </div>
        <div class="col-12 col-md-6">
          <th:block th:replace="~{layout/componentes :: acceso('bi-chat-left-text-fill', 'Reclamos', 'Registra fallas y averías reportadas.', '/reclamos', 'info')}"></th:block>
        </div>
      </div>
    </th:block>
  </body>
</html>
