<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<head>
  <title>Inicio - Secretaria</title>
</head>
  <body>
    <th:block th:fragment="content">
      <div th:replace="~{layout/componentes :: encabezado('Panel de Secretaría', 'Atención al cliente, contratos, instalaciones y reclamos', 'bi-headset', 'inicio-secretaria')}"></div>

      <div class="row g-3">
        <div class="col-12 col-md-6 col-xl-3">
          <th:block th:replace="~{layout/componentes :: acceso('bi-people-fill', 'Clientes', 'Registra, busca y edita los datos de los clientes.', '/clientes', 'info')}"></th:block>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <th:block th:replace="~{layout/componentes :: acceso('bi-file-earmark-text-fill', 'Contratos', 'Registra contratos de servicio y controla su vigencia.', '/contratos', 'primary')}"></th:block>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <th:block th:replace="~{layout/componentes :: acceso('bi-tools', 'Instalaciones', 'Programa instalaciones y asigna al técnico responsable.', '/instalaciones', 'success')}"></th:block>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <th:block th:replace="~{layout/componentes :: acceso('bi-chat-left-text-fill', 'Reclamos', 'Registra las fallas y reclamos reportados por los clientes.', '/reclamos', 'danger')}"></th:block>
        </div>
      </div>
    </th:block>
  </body>
</html>
