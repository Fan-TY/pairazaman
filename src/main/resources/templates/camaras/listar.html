<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: layout(~{::content})}">
<head>
    <title>Parque de Cámaras</title>
</head>
<body>
    <th:block th:fragment="content">
        <!-- Encabezado y Acción -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Cámaras de Seguridad</h2>
                <p class="text-muted mb-0">Dispositivos de monitoreo perimetral e infraestructura visual.</p>
            </div>
            <div>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/camaras/nueva}" class="btn btn-primary shadow-sm">
                    <i class="bi bi-plus-lg me-1"></i> Nueva Cámara
                </a>
            </div>
        </div>

        <!-- Grilla de Tarjetas de Cámaras -->
        <div class="row g-4">
            <div class="col-12 col-md-6 col-xl-4" th:each="cam : ${camaras}">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <span class="badge bg-dark fs-6" th:text="${cam.codigo}">CAM-01</span>
                            <span class="badge" 
                                  th:classappend="${cam.estado == 'OPERATIVA' ? 'bg-success' : (cam.estado == 'MANTENIMIENTO' ? 'bg-warning text-dark' : 'bg-danger')}" 
                                  th:text="${cam.estado}">OPERATIVA</span>
                        </div>
                        <h5 class="card-title fw-bold text-dark mb-2" th:text="${cam.ubicacion}">Ubicación</h5>
                        <p class="card-text text-muted small mb-3">
                            <i class="bi bi-hdd-network me-1"></i> IP: <span th:text="${cam.direccionIp ?: 'DHCP Dinámico'}">192.168.1.100</span>
                        </p>
                        <div class="d-flex justify-content-between align-items-center border-top pt-3">
                            <span class="small text-muted">
                                <i class="bi bi-circle-fill me-1" 
                                   th:classappend="${cam.activa ? 'text-success' : 'text-secondary'}"></i>
                                <span th:text="${cam.activa ? 'En Línea' : 'Desactivada'}">En Línea</span>
                            </span>
                            <a sec:authorize="hasRole('ADMIN')" 
                               th:href="@{'/camaras/eliminar/' + ${cam.id}}" 
                               class="btn btn-outline-danger btn-sm"
                               onclick="return confirm('¿Desea eliminar esta cámara?');">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 text-center py-5 text-muted" th:if="${#lists.isEmpty(camaras)}">
                <i class="bi bi-camera-video-off fs-1 d-block mb-2"></i>
                No hay cámaras configuradas en el sistema.
            </div>
        </div>
    </th:block>
</body>
</html>
