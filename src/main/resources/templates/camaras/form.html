<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<head>
    <title th:text="${tituloVista}">Nueva Cámara</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-12 col-md-7 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0" th:text="${tituloVista}">Registrar Nueva Cámara</h5>
                        <a th:href="@{/camaras}" class="btn btn-outline-secondary btn-sm">Regresar</a>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/camaras/guardar}" th:object="${camara}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="codigo" class="form-label fw-semibold">Código de Cámara <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="codigo" th:field="*{codigo}" 
                                       placeholder="Ej: CAM-06" required maxlength="30">
                            </div>

                            <div class="mb-3">
                                <label for="ubicacion" class="form-label fw-semibold">Ubicación / Zona <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="ubicacion" th:field="*{ubicacion}" 
                                       placeholder="Ej: Pasillo Principal Norte" required maxlength="150">
                            </div>

                            <div class="mb-3">
                                <label for="direccionIp" class="form-label fw-semibold">Dirección IP</label>
                                <input type="text" class="form-control" id="direccionIp" th:field="*{direccionIp}" 
                                       placeholder="Ej: 192.168.1.150" maxlength="45">
                            </div>

                            <div class="mb-3">
                                <label for="estado" class="form-label fw-semibold">Estado Operativo</label>
                                <select class="form-select" id="estado" th:field="*{estado}">
                                    <option value="OPERATIVA">OPERATIVA</option>
                                    <option value="MANTENIMIENTO">MANTENIMIENTO</option>
                                    <option value="DESCONECTADA">DESCONECTADA</option>
                                </select>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="activa" th:field="*{activa}">
                                <label class="form-check-label" for="activa">
                                    Cámara Activa en el Sistema
                                </label>
                            </div>

                            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                                <a th:href="@{/camaras}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4">Guardar Cámara</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
