<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Pairazamán Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card border-0 shadow-lg p-5 rounded-4">
                    <div class="mb-3 text-warning">
                        <i class="bi bi-shield-exclamation display-1"></i>
                    </div>
                    <h1 class="display-4 fw-bold text-dark" th:text="${codigoError ?: '500'}">500</h1>
                    <h4 class="fw-bold mb-3" th:text="${tituloError ?: 'Ha ocurrido un problema'}">Error en el servidor</h4>
                    <p class="text-muted mb-4" th:text="${mensajeError ?: 'No se pudo completar la solicitud requerida.'}">
                        Detalles no disponibles.
                    </p>
                    <div>
                        <a th:href="@{/dashboard}" class="btn btn-primary px-4 py-2">
                            <i class="bi bi-house-door me-1"></i> Volver al Inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
