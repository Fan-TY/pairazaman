<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro de Usuario - Pairazaman</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body class="pz-auth d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-9 col-md-7 col-lg-6 col-xl-5">
                    <div class="pz-auth-card">
                        <div class="text-center px-4 pt-4 pb-2">
                            <img th:src="@{/images/logo.png}" alt="Telecomunicaciones Pairazaman S.A.C." class="pz-auth-logo mb-2">
                            <p class="pz-auth-subtitle mb-0">Crear nueva cuenta</p>
                        </div>

                        <div class="p-4 pt-3 p-sm-5 pt-sm-3">
                            <div th:if="${mensajeError}" class="alert alert-danger py-2 small" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                                <span th:text="${mensajeError}">Ocurrió un error.</span>
                            </div>

                            <form th:action="@{/registro}" th:object="${usuarioDto}" method="post">
                                <div class="mb-3">
                                    <label for="nombreCompleto" class="form-label fw-semibold small">Nombre Completo <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="nombreCompleto" th:field="*{nombreCompleto}"
                                           placeholder="Juan Pérez" required maxlength="120">
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold small">Correo Electrónico <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}"
                                           placeholder="usuario@ejemplo.com" required maxlength="100">
                                </div>

                                <div class="mb-3">
                                    <label for="username" class="form-label fw-semibold small">Nombre de Usuario <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="username" th:field="*{username}"
                                           placeholder="jperez" required maxlength="50">
                                </div>

                                <div class="row g-2 mb-4">
                                    <div class="col-12 col-sm-6">
                                        <label for="password" class="form-label fw-semibold small">Contraseña <span class="text-danger">*</span></label>
                                        <input type="password" class="form-control" id="password" th:field="*{password}" required>
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label for="confirmarPassword" class="form-label fw-semibold small">Confirmar Contraseña <span class="text-danger">*</span></label>
                                        <input type="password" class="form-control" id="confirmarPassword" th:field="*{confirmarPassword}" required>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-pz w-100 py-2 mb-3">
                                    <i class="bi bi-check2-circle me-1"></i> Completar Registro
                                </button>
                            </form>

                            <div class="text-center border-top pt-3">
                                <span class="small text-muted">¿Ya tienes cuenta? </span>
                                <a th:href="@{/login}" class="pz-auth-link">Iniciar Sesión</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
